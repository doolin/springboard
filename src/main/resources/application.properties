# Server Configuration
server.port=8081

# Form-post size limit. These set Tomcat's limit on bodies it parses as
# form parameters (application/x-www-form-urlencoded). They do NOT
# limit JSON request bodies: scripts/smoke-test.sh posts a 3 MB JSON
# body and it reaches Jackson and Bean Validation. 2MB is also Spring
# Boot's default; the value is explicit so it shows in reviews.
#
# History: SB-GL-28 cited these as the compensating control for
# jackson-databind CVE-2023-35116. That suppression was removed in
# SB-GL-62 and no compensating control is claimed here (SB-GL-63).
server.tomcat.max-http-post-size=2MB
server.tomcat.max-http-form-post-size=2MB

# Static Resource Configuration
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:55432/todoapp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=replace-this-dev-secret-with-at-least-32-bytes-for-jwt-signing-key
jwt.expiration=86400000
jwt.refresh-token.expiration=604800000

# Security Configuration
spring.security.filter.order=10
spring.security.user.name=admin
spring.security.user.password=admin

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.todoapp=DEBUG

# Test Configuration
spring.test.database.replace=none

# Bean Definition Overriding
spring.main.allow-bean-definition-overriding=true

# Legacy Pattern Matching Strategy
spring.mvc.pathmatch.matching-strategy=ant_path_matcher 